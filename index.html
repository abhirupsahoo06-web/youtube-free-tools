<!doctype html>
<html lang="en" class="dark scroll-smooth" style="background-color: #0b0c10;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- Theme initialization (prevents FOUC on initial page load) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ytt_theme');
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (theme === 'dark' || !theme) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0b0c10';
            if (themeMeta) themeMeta.setAttribute('content', '#0b0c10');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#ffffff';
            if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
          }
        } catch (_) {}
      })();
    </script>
    <style>
      html.dark,
      html.dark body {
        background-color: #0b0c10;
      }
      html:not(.dark),
      html:not(.dark) body {
        background-color: #ffffff;
      }
    </style>
    
    <!-- Primary Meta Tags -->
    <title>YouTube Free Tools - Free Tools for YouTube Creators</title>
    <meta name="title" content="YouTube Free Tools - Free Tools for YouTube Creators" />
    <meta name="description" content="Simple, fast and free tools to help creators grow, optimize and manage their YouTube content. Discover the next generation of creator utilities." />
    <meta name="keywords" content="YouTube tools, free YouTube tools, creator tools, video optimization, YouTube utility, creator platform" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YouTube Free Tools - Free Tools for YouTube Creators" />
    <meta property="og:description" content="Simple, fast and free tools to help creators grow, optimize and manage their YouTube content." />
    <meta property="og:site_name" content="YouTube Free Tools" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="YouTube Free Tools - Free Tools for YouTube Creators" />
    <meta property="twitter:description" content="Simple, fast and free tools to help creators grow, optimize and manage their YouTube content." />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white dark:bg-[#0b0c10] text-slate-900 dark:text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
